<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND EFFECTS */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(0, 255, 170, 0.10),
            transparent 40%
        );
    pointer-events: none;
    z-index: -1;
}

/* MAIN SECTION */

.hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 30px 20px;
    position: relative;
}

/* TOP BADGE */

.badge {
    display: inline-block;
    border: 1px solid rgba(0, 255, 170, 0.4);
    color: #00ffaa;
    padding: 9px 18px;
    border-radius: 50px;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 35px;
    background: rgba(0, 255, 170, 0.05);
    animation: fadeIn 1.2s ease both;
}

/* ROTATING LOGO */

.logo-container {
    width: 180px;
    height: 180px;
    margin-bottom: 35px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-ring {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: #00ffaa;
    border-right-color: #00ffaa;
    border-radius: 50%;
    animation: spin 3s linear infinite;
    box-shadow: 0 0 20px rgba(0, 255, 170, 0.15);
}

.logo-ring.second {
    inset: 12px;
    border-top-color: transparent;
    border-bottom-color: #00ffaa;
    border-left-color: #00ffaa;
    animation: spinReverse 5s linear infinite;
}

.logo {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: contain;
    padding: 8px;
    background: #101010;
    border: 1px solid rgba(0, 255, 170, 0.5);
    box-shadow: 0 0 35px rgba(0, 255, 170, 0.2);
}

/* HEADLINE */

h1 {
    font-size: clamp(34px, 7vw, 72px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -2px;
    margin-bottom: 20px;
    animation: fadeUp 1s ease both;
}

.highlight {
    background: linear-gradient(
        90deg,
        #00ffaa,
        #ffffff,
        #00ffaa
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: gradientMove 4s linear infinite;
}

/* DESCRIPTION */

.description {
    max-width: 580px;
    color: #a6a6a6;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 30px;
    animation: fadeUp 1.3s ease both;
}

/* BUTTON */

.cta {
    display: inline-block;
    text-decoration: none;
    background: #00ffaa;
    color: #050505;
    padding: 16px 35px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
    transition: 0.3s ease;
}

.cta:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 45px rgba(0, 255, 170, 0.4);
}

/* SMALL INFO */

.bottom-text {
    margin-top: 28px;
    color: #666;
    font-size: 12px;
    letter-spacing: 2px;
}

/* ANIMATIONS */

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

@keyframes spinReverse {
    from {
        transform: rotate(360deg);
    }
    to {
        transform: rotate(0deg);
    }
}

@keyframes gradientMove {
    to {
        background-position: 200% center;
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {
    .logo-container {
        width: 150px;
        height: 150px;
    }

    .logo {
        width: 105px;
        height: 105px;
    }

    h1 {
        letter-spacing: -1px;
    }

    .description {
        font-size: 14px;
    }

    .cta {
        padding: 15px 25px;
    }
}

/* REDUCED MOTION ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
